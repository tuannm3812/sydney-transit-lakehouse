[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "transit-lakehouse"
version = "0.1.0"
description = "Live Sydney transport lakehouse on TfNSW GTFS-realtime feeds."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "gtfs-realtime-bindings>=1.0",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
transit-collector = "transit_lakehouse.collector.__main__:main"
transit-capture-check = "transit_lakehouse.checks.capture:main"
transit-quota-report = "transit_lakehouse.checks.quota_report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_lakehouse"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
