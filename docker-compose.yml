# Phase 0: the collector lands raw snapshots on local disk.
# Redpanda, Spark, the Iceberg catalog and object storage join in
# Phase 1+ (see docs/2_architecture.md); they are deliberately absent
# until 7 days of clean capture prove the source is stable.

services:
  collector:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "transit_lakehouse.collector.healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  checks:
    build: .
    profiles: ["tools"]
    env_file: .env
    entrypoint: ["python", "-m", "transit_lakehouse.checks"]
    working_dir: /app
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
      - ./config:/app/config:ro
      - ./docs/reports:/app/docs/reports

  offload:
    # Ships closed hours to S3 and prunes verified local copies (D-026).
    # No env_file: this job needs no TfNSW key. Credentials come from the
    # EC2 instance role (docs/8_offload.md).
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "transit_lakehouse.offload"]
    environment:
      DATA_DIR: /data
      OFFLOAD_BUCKET: ${OFFLOAD_BUCKET:-}
      AWS_REGION: ap-southeast-2
    volumes:
      - ./data:/data
