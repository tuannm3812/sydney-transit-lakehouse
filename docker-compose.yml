# Phase 0 runs the collector (and the offload and checks tools).
# Phase 1 adds the light worker below, behind the "worker" profile
# (D-023, D-027). Redpanda and Spark join only as an on-demand
# benchmark behind the "bench" profile, on a separate instance and never
# on the collector host (D-041, docs/13_spark_benchmark.md).

services:
  collector:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "transit_lakehouse.collector.healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  checks:
    build: .
    profiles: ["tools"]
    env_file: .env
    entrypoint: ["python", "-m", "transit_lakehouse.checks"]
    working_dir: /app
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
      - ./config:/app/config:ro
      - ./docs/reports:/app/docs/reports

  offload:
    # Ships closed hours to S3 and prunes verified local copies (D-026).
    # No env_file: this job needs no TfNSW key. Credentials come from the
    # EC2 instance role (docs/8_offload.md).
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "transit_lakehouse.offload"]
    environment:
      DATA_DIR: /data
      OFFLOAD_BUCKET: ${OFFLOAD_BUCKET:-}
      AWS_REGION: ap-southeast-2
    volumes:
      - ./data:/data

  worker:
    # Phase 1 light worker: raw snapshots -> bronze/silver Iceberg
    # (D-023, D-027). Behind a profile so `docker compose up` on the
    # collector host does not start it until Mike turns it on after the
    # Phase 0 gate. No env_file: it needs no TfNSW key. The memory cap
    # keeps it from starving the collector on the 2 GB host.
    build: .
    profiles: ["worker"]
    entrypoint: ["python", "-m", "transit_lakehouse.worker"]
    command: ["run", "--loop", "60"]
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    restart: unless-stopped
    mem_limit: 900m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  gold:
    # Phase 2 gold marts (D-035): a one-off dbt build on DuckDB over the
    # silver tables, `docker compose --profile gold run --rm gold build`.
    # Not scheduled yet: it waits for the worker to run live. DuckDB is
    # held to 300 MB and one thread; the whole process peaked at about
    # 690 MB on two real hours (docs/reports/marts-dryrun-20261121.md).
    build: .
    profiles: ["gold"]
    entrypoint: ["python", "-m", "transit_lakehouse.gold"]
    command: ["build"]
    environment:
      DATA_DIR: /data
      GOLD_MEMORY_LIMIT: 300MB
      GOLD_THREADS: "1"
    volumes:
      - ./data:/data
    mem_limit: 900m
    cpus: 1.0

  # --- Redpanda + Spark benchmark (D-041, docs/13_spark_benchmark.md) ---
  # Only on the on-demand benchmark instance. Everything it writes goes
  # to ./data-bench, apart from Redpanda's log (a named volume).
  redpanda:
    image: redpandadata/redpanda:v25.2.10
    profiles: ["bench"]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpanda:/var/lib/redpanda/data
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 10s
      retries: 12

  bench-stream:
    # The Spark job: Redpanda -> bronze/silver Iceberg in ./data-bench.
    build:
      context: .
      dockerfile: Dockerfile.bench
    profiles: ["bench"]
    command:
      - stream
      - --trigger=${BENCH_TRIGGER_S:-15}
      - --driver-memory=${BENCH_DRIVER_MEMORY:-3g}
    environment:
      BENCH_BOOTSTRAP: redpanda:9092
    volumes:
      - ./data-bench:/bench
      - ./config:/app/config:ro
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: ${BENCH_SPARK_MEM_LIMIT:-6g}

  bench-produce:
    # Replays S3 hours into Redpanda, `docker compose --profile bench run
    # --rm bench-produce produce --bucket ... --start ... --end ...`.
    # No env_file: S3 access comes from the instance role (read-only).
    build:
      context: .
      dockerfile: Dockerfile.bench
    profiles: ["bench"]
    command: ["topics"]
    environment:
      BENCH_BOOTSTRAP: redpanda:9092
      AWS_REGION: ap-southeast-2
    volumes:
      - ./data-bench:/bench
      - ./config:/app/config:ro
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  redpanda:
